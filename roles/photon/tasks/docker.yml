---
- name: Install Docker
  tdnf:
    name: docker
    # present, not latest: upgrading Docker restarts every container, so it is
    # left to normal patching (tdnf_distrosync or the host's update timer)
    state: present

- name: Create docker group
  ansible.builtin.group:
    name: docker
    gid: "{{ docker_group_id }}"
    state: present

- name: Create a docker user
  ansible.builtin.user:
    name: docker
    uid: "{{ docker_user_id }}"
    shell: /bin/bash
    groups:
      - docker
    append: yes
    expires: -1
    password_expire_max: -1

# Use a systemd drop-in rather than editing the packaged unit in
# /usr/lib/systemd/system, which is overwritten on every docker package update.
- name: Create docker.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run the docker service with the docker group
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/group.conf
    content: |
      # Managed by Ansible (photon role)
      [Service]
      Group=docker
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload unit files
    - restart docker

- name: Create Docker configuration folder
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Check for an existing daemon.json
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_daemon_json

# Seeded once: an existing daemon.json (hand-edited, or maintained by another
# tool) is left alone unless force_reset_docker_config is true. Insecure
# registries are set through daemon.json (see daemon.json.j2).
- name: Configure docker daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0400"
    owner: root
    group: root
    force: "{{ force_reset_docker_config | bool }}"
    backup: true
  notify: restart docker

- name: Report that daemon.json was left unchanged
  ansible.builtin.debug:
    msg: >-
      /etc/docker/daemon.json already exists and was left unchanged.
      To replace it with docker_daemon_config from this playbook,
      set force_reset_docker_config: true.
  when:
    - docker_daemon_json.stat.exists
    - not (force_reset_docker_config | bool)

- name: Set Docker start and run at boot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: yes
