---
#
# Ensure installed
#
- name: Ensure syslog-ng installed on host
  tdnf:
    name: syslog-ng
    state: present

# syslog-ng reads the journal itself (system() in the template), so this role
# no longer sets ForwardToSyslog=yes in journald.conf. An existing setting is
# harmless and is left as it is.
- name: configure syslog-ng.conf
  ansible.builtin.template:
    src: syslog-ng.conf.j2
    dest: /etc/syslog-ng/syslog-ng.conf
    owner: root
    group: root
    mode: 0644
    backup: true
    validate: syslog-ng --syntax-only -f %s
  notify: restart syslog-ng

- name: Start syslog-ng with the new config before checking delivery
  ansible.builtin.meta: flush_handlers

# syslog-ng stays "active" while forwarding nothing (a dead destination, or a
# source that failed at startup), so prove a message actually leaves.
- name: Verify a test message reaches the remote syslog server
  ansible.builtin.shell: |
    written() {
      syslog-ng-ctl stats | awk -F';' '$1 == "dst.syslog" && $2 == "d_remote#0" && $5 == "written" { print $6; exit }'
    }
    before=$(written)
    if [ -z "$before" ]; then
      echo "d_remote is missing from syslog-ng-ctl stats"
      exit 1
    fi
    logger -t ansible-syslog-check "delivery check from $(hostname)"
    for _ in $(seq 1 {{ syslog_verify_timeout }}); do
      sleep 1
      after=$(written)
      if [ "${after:-0}" -gt "$before" ]; then
        echo "written ${before} -> ${after}"
        exit 0
      fi
    done
    echo "nothing written to {{ syslog_remote_server }}:{{ syslog_remote_port }} in {{ syslog_verify_timeout }}s (written ${before}); check DNS and the port"
    exit 1
  changed_when: false
  when:
    - syslog_verify_delivery | bool
    - syslog_remote_server | default('', true) | length > 0
    - syslog_remote_port | default(0, true) | int > 0
    - not (docker_testing_of_photon_in_docker | bool)
