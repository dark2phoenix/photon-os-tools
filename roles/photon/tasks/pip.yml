---

# For Photon 3 and earlier, Python 2 is the default
- name: Enable python pip on Photon 3 or lower
  block:
    - name: Install Python pip
      tdnf:
        name: python-pip

    - name: Configure pip with easy_install
      ansible.builtin.command: easy_install pip
      args:
        creates: /usr/bin/pip

    - name: Install virtualenv via pip
      ansible.builtin.pip:
        name: virtualenv
        state: present
  when:
    - ansible_facts['distribution_major_version'] | int <= 3

# For Photon 4 and later, Python 3 is the default. Install from tdnf rather
# than pip so the system Python stays package-managed.
- name: Install python3 pip and virtualenv via tdnf
  tdnf:
    name:
      - python3-pip
      - python3-virtualenv
    state: present
  when:
    - ansible_facts['distribution_major_version'] | int >= 4
