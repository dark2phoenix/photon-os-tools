---
# -------- package management
- ansible.builtin.include_tasks: tdnf.yml
- ansible.builtin.include_tasks: pip.yml

# -------- docker setup
- ansible.builtin.include_tasks: docker.yml
  when: not docker_testing_of_photon_in_docker

# -------- log forwarding support
- ansible.builtin.include_tasks: logstash.yml
  when: syslog_remote_server is defined

# -------- configure basic iptables rules
- ansible.builtin.include_tasks: iptables.yml

# -------- configure timesync
- ansible.builtin.include_tasks: timesync.yml

# -------- Install local ssl root certificate
- ansible.builtin.include_tasks: certificates.yml
  when: ssl_root_certificate_pem is defined

# -------- default user operations 
- ansible.builtin.include_tasks: users.yml