---
#---------------------------
# Docker Settings
#---------------------------
# prevent doing things that will break under docker.
# specifically added so that travis-ci can test inside docker
docker_testing_of_photon_in_docker: no
# docker group id (gets created) for socket access and similar
docker_group_id: 995
# docker user id (gets created)
docker_user_id: 233
# Insecure registries docker is allowed to connect to
# Format:
#   docker_insecure_registries:
#     - host: host1
#       port: port1
#     - host: host2
#       port: port2
docker_insecure_registries: []

# Docker Daemon Config
# This converts directly to JSON. Written to /etc/docker/daemon.json only when
# that file doesn't exist yet, unless force_reset_docker_config is true.
docker_daemon_config:
  exec-opts:
    - "native.cgroupdriver=systemd"
  log-driver: "json-file"
  log-opts:
    max-size: "10m"
    max-file: "3"
  storage-driver: "overlay2"
# Replace an existing /etc/docker/daemon.json with docker_daemon_config
force_reset_docker_config: false

#------------------
# Firewall Settings
#------------------
# Inbound ports allowed by the role's firewall ("port" or "port/proto"; tcp if
# no protocol). Used when the role writes /etc/systemd/scripts/ip4save: on a
# new host, when the file is already the role's own, or with
# force_reset_firewall.
firewall_allowed_ports:
  - 22/tcp
  - 80/tcp
  - 443/tcp
# Replace an existing, locally changed ip4save with the role's firewall
force_reset_firewall: false

#------------------
# tdnf Settings
#------------------
# Default variables for adding a custom photon repo
#
#photon_yum_repo:
#photon_yum_repo_enabled:
# Refresh tdnf repository metadata before installing (stale metadata causes 404s
# when the repo has replaced a package version)
#
tdnf_updatecache: yes
# Update all installed packages to the latest in the current distribution
tdnf_distrosync: no
tdnf_packages:
  - sudo
  - bindutils
  - openssl-c_rehash
  - ansible
  - vim
  - vim-extra
  - iputils
  - nfs-utils
  - logrotate
  - wget
  - ntp
  - tzdata
  - traceroute
  - tar
  - less
tdnf_additional_packages: []

#------------------
# Syslog forwarding Settings
#------------------
# Server to forward syslog to. Prefer a DNS name over an IP, so moving the
# syslog server doesn't silently break forwarding.
syslog_remote_server:
# Port to forward syslog to
syslog_remote_port: 514
# Transport for the remote destination: tcp or udp
syslog_remote_transport: tcp
# Disk buffer for the remote destination, in bytes (0 = memory queue only, so
# messages are dropped while the server is down)
syslog_disk_buffer_bytes: 268435456
# After configuring, send a logger line and fail unless the remote
# destination's written counter rises within syslog_verify_timeout seconds
syslog_verify_delivery: true
syslog_verify_timeout: 15
# File to log locally to.  If unset, won't log to a file
syslog_local_file: /var/log/messages

#------------------
# timesync/timezone Settings
#------------------
# Timezone to set OS to (use TZdata values)
ntp_timezone: "Etc/UTC"
# List of time servers to synch with
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org
# List to sync with if above list cannot be reached
ntp_fallback_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org

#------------------
# SSL Certificate settings
#------------------
# Inline certificate (Include Begin and End Certificate lines)
# -----BEGIN CERTIFICATE-----
# ...
# -----END CERTIFICATE-----
#
ssl_root_certificate_pem:
# Name of the certificate to be stored in /etc/ssl/certs
ssl_root_certificate_pem_filename:

#------------------
# User settings
#------------------
users_root_pwd_no_expire: no