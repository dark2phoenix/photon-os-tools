---
- name: reload unit files
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not docker_testing_of_photon_in_docker

- name: restart syslog-ng
  ansible.builtin.systemd_service:
    name: syslog-ng
    state: restarted
    enabled: yes
  when: not docker_testing_of_photon_in_docker

- name: restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
    enabled: yes
  when: not docker_testing_of_photon_in_docker

- name: restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    enabled: yes
  when: not docker_testing_of_photon_in_docker

- name: Restart systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    state: restarted
  listen: systemd-timesyncd configuration changed

- name: Write adjtime
  ansible.builtin.command: hwclock --systohc
  when: ansible_facts['virtualization_role'] == "host" or ansible_facts['virtualization_role'] == "NA"
  listen: systemd-timesyncd configuration changed
